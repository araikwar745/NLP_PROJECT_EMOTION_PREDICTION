name: App checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Python ${{ matrix.python }} / saved model and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Install browser checks
        if: matrix.python == '3.12'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Check the real web page
        if: matrix.python == '3.12'
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8765 --workers 1 > /tmp/nlp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/nlp-server.log' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/health > /dev/null; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then exit 1; fi
            sleep 1
          done
          python tests/check_browser.py
